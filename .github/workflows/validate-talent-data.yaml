name: CI

on:
  pull_request:
    branches: ["develop"]
    paths:
      - 'public/data/meet-the-talent.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  json-yaml-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch from the fork
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@v3.2.1
        with:
          comment: "true"
          json_schema: public/data/schema/meet-the-talent-schema.json
          files: |
            public/data/meet-the-talent.json
          use_gitignore: false
          ajv_strict_mode: false

      - name: Install Prettier
        run: |
          npm install -g prettier

      - name: Format with Prettier
        run: |
          prettier --write public/data/meet-the-talent.json

      - name: Commit changes
        if: ${{ steps.json-yaml-validate.outcome == 'success' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/meet-the-talent.json
          git commit -m "Apply Prettier formatting"
          # Push changes to the original branch in the fork
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
